- text: "Chào bạn, hôm nay khoẻ không?"

- text: "Ê, cuối tuần này có phim gì hay không nhỉ?"

- text: >
    Hôm nay có 3 đầu việc: viết báo cáo tuần, deploy bản staging, review PR
    cho module thanh toán. An thực hiện viết báo cáo, Bình vừa giám sát vừa
    thực hiện deploy, còn review PR thì Dũng thực hiện, Chi kiểm định, cần
    xong trước thứ 6.

- text: "Mai Lan phụ trách thiết kế banner quảng cáo cho chiến dịch mới, cần xong trước thứ 3 tuần sau."

- text: "Cảm ơn cả team đã làm việc chăm chỉ tuần này nhé!"
